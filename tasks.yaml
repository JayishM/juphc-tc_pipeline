apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
  description: Clones a Git repository revision into the shared workspace
spec:
  workspaces:
    - name: output
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: "main"
  steps:
    - name: clone
      image: alpine/git:v2.40.1
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -e
        git clone -b $(params.revision) --single-branch $(params.url) .
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
  description: Installs Node.js dependencies
spec:
  workspaces:
    - name: source
  steps:
    - name: npm-install
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
  description: Runs automated Jasmine unit tests
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine-test
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm test
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
  description: Builds and pushes container image using Buildah
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      type: string
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.31.0
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -e
        buildah --storage-driver=vfs bud -t $(params.IMAGE) .
        buildah --storage-driver=vfs push $(params.IMAGE)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-to-ibm-cloud
  description: Deploys container image to IBM Cloud Code Engine
spec:
  workspaces:
    - name: source
  params:
    - name: image-name
      type: string
    - name: app-name
      type: string
      default: "tax-calculator"
  steps:
    - name: update-deployment
      image: icr.io/ibm/ibm-cloud-cli:latest
      script: |
        #!/bin/sh
        set -e
        ibmcloud ce application update --name $(params.app-name) --image $(params.image-name)
